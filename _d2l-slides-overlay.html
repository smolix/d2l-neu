<!--
  Top navigation bar injected into every slide deck via Quarto's
  `include-after-body`. Mirrors the book's chrome:
    - 280px white box on the left with the d2l logo
    - blue navbar on the right with Book Chapter / Slides / Courses /
      GitHub / Discuss links + a Fullscreen toggle button
  Same visual treatment as `_book/index.html` and `_book/slides/index.html`.

  Path math, with the deck deployed at
  `<root>/slides/<fw>/<chapter>/<file>.html` (3 dirs deep under root):
    ../../../index.html                → <root>/index.html        (book home)
    ../../index.html                   → <root>/slides/index.html (slides landing)
    ../../../static/logo-with-text.png → <root>/static/logo-with-text.png
  The "Book Chapter" link is rewritten by JS to the corresponding book
  chapter URL (e.g. /chapter_x/foo.html), and the logo + chapter labels
  are kept in sync with the framework the deck belongs to.
-->
<nav class="d2l-deck-nav">
  <div class="d2l-deck-brand">
    <a class="d2l-deck-logo" href="../../../index.html"
       title="{{t:deck.home_title}}">
      <img src="../../../static/logo-with-text.png" alt="{{t:book.title}}">
    </a>
  </div>
  <ul class="d2l-deck-nav-links">
    <li><a href="../../../index.html">{{t:deck.book_chapter}}</a></li>
    <li><a href="../../index.html">{{t:nav.slides}}</a></li>
    <li><a href="https://courses.d2l.ai">{{t:nav.courses}}</a></li>
    <li><a href="https://github.com/smolix/d2l-neu" title="{{t:nav.github}}">{{t:nav.github}}</a></li>
    <li><a href="{{t:forum.url}}">{{t:nav.discuss}}</a></li>
    <li>
      <button type="button" id="d2l-nav-fullscreen" class="d2l-nav-fullscreen-btn"
              title="{{t:deck.fullscreen_title}}" aria-label="{{t:deck.fullscreen_aria}}"
              aria-pressed="false">
        <svg class="icon-enter-fs" viewBox="0 0 16 16" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 5.5V2h3.5M10.5 2H14v3.5M14 10.5V14h-3.5M5.5 14H2v-3.5"/>
        </svg>
        <svg class="icon-exit-fs" viewBox="0 0 16 16" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5.5 2v3.5H2M14 5.5h-3.5V2M10.5 14v-3.5H14M2 10.5h3.5V14"/>
        </svg>
        <span class="d2l-fs-label">{{t:deck.fullscreen}}</span>
      </button>
    </li>
  </ul>
</nav>
<!-- Presenter / speaker-view toggle and Fullscreen toggle, parked in the
     bottom-left control cluster next to reveal's menu + chalkboard icons. -->
<button id="d2l-deck-presenter" class="d2l-presenter-btn"
        title="{{t:deck.presenter_title}}"
        aria-label="{{t:deck.presenter_aria}}">
  <!-- Inline SVG (Quarto's revealjs doesn't load the bootstrap-icons font):
       a presentation screen with a speaker figure. -->
  <svg viewBox="0 0 16 16" width="21" height="21" fill="none"
       stroke="currentColor" stroke-width="1.2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="1.1" y="1.7" width="13.8" height="9.2" rx="1.2"/>
    <path d="M5.6 13.4h4.8M8 10.9v2.5"/>
    <circle cx="8" cy="5" r="1.35" fill="currentColor" stroke="none"/>
    <path d="M5.5 8.7a2.5 2.5 0 0 1 5 0z" fill="currentColor" stroke="none"/>
  </svg>
</button>
<button id="d2l-deck-fullscreen" class="d2l-fullscreen-btn"
        title="{{t:deck.fullscreen_mobile_title}}"
        aria-label="{{t:deck.fullscreen_mobile_aria}}"
        aria-pressed="false">
  <svg class="icon-enter-fs" viewBox="0 0 16 16" width="19" height="19" fill="none"
       stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 5.5V2h3.5M10.5 2H14v3.5M14 10.5V14h-3.5M5.5 14H2v-3.5"/>
  </svg>
  <svg class="icon-exit-fs" viewBox="0 0 16 16" width="19" height="19" fill="none"
       stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5.5 2v3.5H2M14 5.5h-3.5V2M10.5 14v-3.5H14M2 10.5h3.5V14"/>
  </svg>
</button>
<script>
// (1) Rewrite the "Book Chapter" link to the corresponding book HTML
//     (e.g. /slides/pytorch/chapter_x/foo.html → /chapter_x/foo.html).
//     The logo link stays pointing at book home.
// (2) Wire the "Presenter" button to the reveal-notes plugin's open() API.
// (3) Wire the "Fullscreen" buttons (#d2l-deck-fullscreen and #d2l-nav-fullscreen)
//     to toggle both native browser fullscreen (Desktop, iPad Safari, Android)
//     AND a CSS viewport-fullscreen class (`body.d2l-deck-fullscreen`) that hides
//     the top navbar and maximizes the slide canvas (also works on iPhone iOS
//     Safari and inside iframe embeds where native requestFullscreen is unavailable).
(function() {
  function isNativeFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.mozFullScreenElement || document.msFullscreenElement);
  }

  function isFullscreenActive() {
    return isNativeFullscreen() || document.body.classList.contains('d2l-deck-fullscreen');
  }

  function updateFullscreenUI(active) {
    document.body.classList.toggle('d2l-deck-fullscreen', !!active);
    var btns = [
      document.getElementById('d2l-deck-fullscreen'),
      document.getElementById('d2l-nav-fullscreen')
    ];
    for (var k = 0; k < btns.length; k++) {
      if (btns[k]) {
        btns[k].setAttribute('aria-pressed', active ? 'true' : 'false');
        btns[k].setAttribute('title', active
          ? '{{tjs:deck.fullscreen_exit_title}}'
          : '{{tjs:deck.fullscreen_title}}');
      }
    }
    syncChrome();
    if (window.Reveal && typeof Reveal.layout === 'function') {
      setTimeout(function() { Reveal.layout(); }, 30);
    }
  }

  function toggleFullscreen(ev) {
    if (ev) ev.preventDefault();
    var currentlyActive = isFullscreenActive();
    if (!currentlyActive) {
      updateFullscreenUI(true);
      var root = document.documentElement;
      var req = root.requestFullscreen || root.webkitRequestFullscreen ||
                root.mozRequestFullScreen || root.msRequestFullscreen;
      if (typeof req === 'function') {
        try {
          var p = req.call(root);
          if (p && typeof p.catch === 'function') {
            p.catch(function() { /* CSS fullscreen fallback remains active */ });
          }
        } catch (e) { /* CSS fullscreen fallback remains active */ }
      }
    } else {
      updateFullscreenUI(false);
      if (isNativeFullscreen()) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
        if (typeof exit === 'function') {
          try {
            var p2 = exit.call(document);
            if (p2 && typeof p2.catch === 'function') p2.catch(function() {});
          } catch (e) {}
        }
      }
    }
  }

  function init() {
    var parts = window.location.pathname.split('/');
    var i = parts.lastIndexOf('slides');
    if (i >= 0 && i + 3 < parts.length) {
      var prefix = parts.slice(0, i).join('/') + '/';
      var framework = parts[i + 1];
      var chapter = parts[i + 2];
      var file = parts[i + 3];
      var chapterUrl = prefix + chapter + '/' + file +
                       '?framework=' + encodeURIComponent(framework);
      var first = document.querySelector('.d2l-deck-nav-links a');
      if (first) first.setAttribute('href', chapterUrl);
    }
    var presenter = document.getElementById('d2l-deck-presenter');
    if (presenter) {
      presenter.addEventListener('click', function(ev) {
        ev.preventDefault();
        try {
          var notes = window.Reveal && Reveal.getPlugin &&
                      Reveal.getPlugin('notes');
          if (notes && typeof notes.open === 'function') {
            notes.open();
            return;
          }
        } catch (e) { /* fall through to keyboard fallback */ }
        var ev2 = new KeyboardEvent('keydown',
            { key: 'S', code: 'KeyS', keyCode: 83, which: 83,
              bubbles: true, cancelable: true });
        document.dispatchEvent(ev2);
      });
    }

    var fsBtn = document.getElementById('d2l-deck-fullscreen');
    if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
    var navFsBtn = document.getElementById('d2l-nav-fullscreen');
    if (navFsBtn) navFsBtn.addEventListener('click', toggleFullscreen);

    // Keep UI synchronized when the user exits native fullscreen via Esc or F
    var onNativeFsChange = function() {
      updateFullscreenUI(isNativeFullscreen());
    };
    document.addEventListener('fullscreenchange', onNativeFsChange);
    document.addEventListener('webkitfullscreenchange', onNativeFsChange);

    // Also allow Esc to exit CSS-only fullscreen on mobile/iframe
    document.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape' && document.body.classList.contains('d2l-deck-fullscreen') && !isNativeFullscreen()) {
        updateFullscreenUI(false);
      }
    });

    attachChrome();
  }

  // (4) Scale the fixed navbar by the SAME factor reveal scales the slides,
  //     so the whole deck resizes as one unit (otherwise the px-sized navbar
  //     stays huge while the content shrinks). Anchored top-left; width is
  //     pre-divided by the scale so it still spans the viewport after scaling.
  function syncChrome() {
    if (!window.Reveal || typeof Reveal.getScale !== 'function') return;
    var s = Reveal.getScale() || 1;
    var nav = document.querySelector('.d2l-deck-nav');
    if (nav) {
      nav.style.transformOrigin = 'top left';
      nav.style.right = 'auto';
      nav.style.width = (100 / s) + 'vw';
      nav.style.transform = 'scale(' + s + ')';
    }
  }
  function attachChrome() {
    if (window.Reveal && typeof Reveal.on === 'function') {
      Reveal.on('ready', syncChrome);
      Reveal.on('resize', syncChrome);
      if (typeof Reveal.isReady === 'function' && Reveal.isReady()) syncChrome();
    } else {
      setTimeout(attachChrome, 60);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
