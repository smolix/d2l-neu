        - chapter_natural-language-processing-applications/sentiment-analysis-rnn.qmd
        - chapter_natural-language-processing-applications/sentiment-analysis-cnn.qmd
        - chapter_natural-language-processing-applications/natural-language-inference-and-dataset.qmd
        - chapter_natural-language-processing-applications/natural-language-inference-attention.qmd
        - chapter_natural-language-processing-applications/finetuning-bert.qmd
        - chapter_natural-language-processing-applications/natural-language-inference-bert.qmd
    - references.qmd

bibliography: d2l.bib
link-citations: true
number-sections: true
crossref:
  chapters: true

# Pandoc's example_lists reads a line that starts with "@label." or "@label)"
# as a numbered example item, and that label then shadows the crossref: every
# @eq-x in the page renders as a bare number with no link and no warning. A
# wrapped exercise line like "   @eq-temperature. Write ..." triggers it. The
# book uses no example lists, so turn the extension off.
from: markdown-example_lists

filters:
  - _svg-to-pdf.lua

format:
  html:
    theme:
      - cosmo
      - _d2l-theme.scss
    grid:
      sidebar-width: 280px
      body-width: 1100px
      margin-width: 200px
      gutter-width: 1.5em
    code-copy: true
    code-overflow: wrap
    toc: true
    css: _d2l-style.css
    include-in-header: _d2l-favicon.html
    include-after-body:
      - _d2l-slides-data.html
      - _d2l-notebooks-data.html
      - _d2l-tabs.html
      - _d2l-notebooks.html
      - _d2l-mobilenav.html
  pdf:
    pdf-engine: xelatex
    documentclass: book
    papersize: a4
    fontsize: 11pt
    classoption:
      - twoside
      - openright
    mainfont: "SourceSerif4"
    mainfontoptions:
      - Path=static/fonts/
      - Extension=.ttf
      - UprightFont=*-Regular
      - BoldFont=*-Bold
      - ItalicFont=*-Italic
    sansfont: "SourceSans3"
    sansfontoptions:
      - Path=static/fonts/
      - Extension=.ttf
      - UprightFont=*-Regular
      - BoldFont=*-Bold
      - ItalicFont=*-Italic
    monofont: "Inconsolata"
    monofontoptions:
      - Path=static/fonts/
      - Extension=.ttf
      - UprightFont=*-Regular
      - BoldFont=*-Bold
      - Scale=0.9
    geometry:
      - left=1in
      - right=1in
      - top=1in
      - bottom=1in
      - twoside
    linkcolor: black
    citecolor: black
    urlcolor: black
    include-in-header: static/d2l-preamble.tex
    toc: true
    toc-depth: 2
    code-block-bg: "#f2f2f2"
    fig-pos: "htbp"
    keep-tex: true
    latex-auto-install: false

execute:
  enabled: false
  freeze: auto
