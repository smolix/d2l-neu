project:
  type: book
  output-dir: _book
  resources:
    - favicon.ico
    - /static/apple-touch-icon.png
    # landing-page images are referenced with a ?v=<hash> cache buster
    # (tools/render_logo_grid.py), which hides them from Quarto's resource
    # discovery, so they are copied explicitly
    - /static/landing/**

book:
  title: "Dive into Deep Learning"
  favicon: static/favicon-32.png
  author:
    - Alexander J. Smola
  date: today
  cookie-consent:
    type: express
    style: headline
    palette: dark
  navbar:
    background: "#2196F3"
    search: true
    right:
      - text: Slides
        href: slides/index.html
      - text: Courses
        href: https://courses.d2l.ai
      - text: GitHub
        icon: github
        href: https://github.com/smolix/d2l-neu
      - text: Discuss
        href: https://d2l.discourse.group
      - text: PDF
        menu:
          - text: PyTorch
            href: /pdf/Dive-into-Deep-Learning-pytorch.pdf
          - text: JAX
            href: /pdf/Dive-into-Deep-Learning-jax.pdf
          - text: TensorFlow
            href: /pdf/Dive-into-Deep-Learning-tensorflow.pdf
          - text: MXNet
            href: /pdf/Dive-into-Deep-Learning-mxnet.pdf
          - text: "---"
          - text: "Parts (PyTorch)"
          - text: Basics
            href: /pdf/parts/Dive-into-Deep-Learning-basics-pytorch.pdf
          - text: Advanced
            href: /pdf/parts/Dive-into-Deep-Learning-advanced-pytorch.pdf
          - text: Language Models
            href: /pdf/parts/Dive-into-Deep-Learning-language-models-pytorch.pdf
          - text: Mathematics for Deep Learning
            href: /pdf/parts/Dive-into-Deep-Learning-mathematics-for-deep-learning-pytorch.pdf
      - text: Notebooks
        menu:
          - text: PyTorch
            href: /notebooks/d2l-pytorch.zip
          - text: JAX
            href: /notebooks/d2l-jax.zip
          - text: TensorFlow
            href: /notebooks/d2l-tensorflow.zip
          - text: MXNet
            href: /notebooks/d2l-mxnet.zip
      - icon: translate
        aria-label: Language
        menu:
          - text: "en · English"
            href: /
          - text: "zh · 中文"
            href: https://zh.d2l.ai
          - text: "pt · Português"
            href: https://pt.d2l.ai
          - text: "tr · Türkçe"
            href: https://tr.d2l.ai
          - text: "vi · Tiếng Việt"
            href: https://vi.d2l.ai
          - text: "ko · 한국어"
            href: https://ko.d2l.ai
          - text: "ja · 日本語"
