# UI string catalog of the book: every piece of text the build emits outside
# the chapter sources (navbar, injected HTML/JS, slide index and templates,
# PDF front matter, notebook downloads), plus the per-language settings.
#
# Read by tools/i18n.py. A localized build sets
#   D2L_LANG=<code>            ISO 639-1 code of the language (default: en)
#   D2L_LOCALE_FILE=<path>     YAML file with the same schema; its keys override
#                              these key by key, a missing key stays English
# (docs/build-guide.md §4.14). Keys are flat and dotted; a locale file may also
# nest them (`nav: {slides: スライド}` is `nav.slides`). `{name}` marks a value
# the emitter fills in; keep every placeholder a key has here. A key ending in
# `.one` / `.other` is a count (`.one` for n = 1).
#
# `python3 tools/i18n.py check FILE` validates a locale file against this one.

# ── Language settings (not strings) ─────────────────────────────────────────
code: en                    # ISO 639-1; the language menu marks it as current
lang: en                    # BCP-47 for Quarto `lang:` (localizes Quarto's own UI)
dir: ltr                    # ltr | rtl
site.hosts: [d2l.ai, en.d2l.ai]   # first host is canonical (slide footers)
site.languages_url: https://d2l-data.smola.org/site/languages.json
forum.mode: english         # english: link the English topics | own: own category
forum.category: 5           # Discourse category id (5 = English Version)
forum.url: https://d2l.discourse.group
# HTML fonts: CSS font-family stacks. A locale that changes one gets a style
# override; fonts.html.google lists extra Google Fonts css2 families to load
# (e.g. "Noto Sans JP:wght@400;500;700").
fonts.html.sans: "'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
fonts.html.mono: "'JetBrains Mono', ui-monospace, monospace"
fonts.html.google: []
# PDF fonts (XeLaTeX). The English ones ship in static/fonts/; any other name
# must be installed on the build host (fc-list). fonts.pdf.cjk (and _sans,
# _mono) load xeCJK with that font for CJK text in the PDFs and Beamer decks.
fonts.pdf.main: SourceSerif4
fonts.pdf.sans: SourceSans3
fonts.pdf.mono: Inconsolata
fonts.pdf.cjk: null
fonts.pdf.cjk_sans: null
fonts.pdf.cjk_mono: null
# Pandoc/Quarto `lang` for the PDFs (babel hyphenation and LaTeX names).
# null: not set. Set it only for languages whose babel module works with
# XeLaTeX (de, fr, es, pt, ...).
pdf.lang: null
# Overrides of Quarto's own language strings (keys of Quarto's
# share/language/_language.yml), e.g. quarto.crossref-ch-prefix: 第
# English needs none.

