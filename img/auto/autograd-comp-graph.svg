<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 47 532 150" width="532" height="150"><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');]]></style><line x1="117" y1="94" x2="205.76" y2="94.00" stroke="#15181C" stroke-width="2.5"/><path d="M215,94 L205.41,98.28 L205.41,89.72 Z" fill="#15181C"/><line x1="325" y1="94" x2="413.76" y2="94.00" stroke="#15181C" stroke-width="2.5"/><path d="M423,94 L413.41,98.28 L413.41,89.72 Z" fill="#15181C"/><text x="174" y="78" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">dot</text><text x="379" y="78" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">× 2</text><line x1="423" y1="114" x2="334.24" y2="114.00" stroke="#1565C0" stroke-width="2.5"/><path d="M325,114 L334.59,109.72 L334.59,118.28 Z" fill="#1565C0"/><line x1="215" y1="114" x2="126.24" y2="114.00" stroke="#1565C0" stroke-width="2.5"/><path d="M117,114 L126.59,109.72 L126.59,118.28 Z" fill="#1565C0"/><text x="379" y="132" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1565C0" text-anchor="middle" dominant-baseline="central">∂y/∂a = 2</text><text x="174" y="132" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1565C0" text-anchor="middle" dominant-baseline="central">∂a/∂x = 2x</text><rect x="39" y="75" width="78" height="58" rx="10" fill="#EDE9F8" stroke="#6C51B4" stroke-width="2"/><text x="78" y="96" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">x</text><text x="78" y="117" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#565D66" text-anchor="middle" dominant-baseline="central">input</text><rect x="215" y="75" width="110" height="58" rx="10" fill="#D6EDFC" stroke="#1565C0" stroke-width="2"/><text x="270" y="96" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">a = xᵀx</text><text x="270" y="117" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#565D66" text-anchor="middle" dominant-baseline="central">scalar</text><rect x="423" y="75" width="130" height="58" rx="10" fill="#DDF0DD" stroke="#2E7D3E" stroke-width="2"/><text x="488" y="96" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">y = 2a</text><text x="488" y="117" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#565D66" text-anchor="middle" dominant-baseline="central">output</text><text x="78" y="64" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#15181C" text-anchor="start" dominant-baseline="central">forward →</text><text x="553" y="64" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1565C0" text-anchor="end" dominant-baseline="central">← backward</text><text x="300" y="186" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">chain rule:  ∂y/∂x = (∂y/∂a)(∂a/∂x) = 2 · 2x = 4x</text></svg>
