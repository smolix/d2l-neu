="2"/><text x="214" y="92" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">x²</text><rect x="314" y="66" width="116" height="52" rx="10" fill="#F0F2F5" stroke="#565D66" stroke-width="2" stroke-dasharray="5 4"/><text x="372" y="84" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">u</text><text x="372" y="105" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#565D66" text-anchor="middle" dominant-baseline="central">constant</text><rect x="474" y="66" width="116" height="52" rx="10" fill="#DDF0DD" stroke="#2E7D3E" stroke-width="2"/><text x="532" y="92" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#15181C" text-anchor="middle" dominant-baseline="central">z = u·x</text><path d="M532,118 C 532,170 70,170 70,118" fill="none" stroke="#1565C0" stroke-width="2.4"/><line x1="71" y1="132" x2="70" y2="119" stroke="#1565C0" stroke-width="2.5"/><path d="M70,119 L74.52760607944253,127.35169343243602 L66.8029776935117,127.94589561596916 Z" fill="#1565C0"/><text x="310" y="174" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1565C0" text-anchor="middle" dominant-baseline="central">∂z/∂x = u   (gradient returns only through the direct edge)</text><text x="310" y="244" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#565D66" text-anchor="middle" dominant-baseline="central">the path above u is cut, so z = x·x·x but ∂z/∂x = u, not 3x²</text></svg>
