<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 282" width="540" height="282"><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');]]></style><rect x="20" y="12" width="500" height="42" rx="8" fill="#E6F4E6" stroke="#2CA02C" stroke-width="2"/><text x="270" y="37.22" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.8" font-weight="700" fill="#227D22" text-anchor="middle">Rectified Flow Reflow: Re-Pair Noise Z₁ = ε With ODE Endpoint Z₀ = Φ<tspan baseline-shift="sub" font-size="70%">1→0</tspan>(ε) &amp; Retrain</text><rect x="20" y="68" width="240" height="138" rx="10" fill="#FFFFFF" stroke="#D62728" stroke-width="2"/><rect x="26" y="74" width="228" height="30" rx="6" fill="#FAE5E5" stroke="none" stroke-width="0"/><text x="140" y="93.29" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C92526" text-anchor="middle">Round 1: Independent Pairs (X₀, X₁)</text><text x="140" y="126.13" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15181C" text-anchor="middle">Straight chords cross heavily:</text><text x="140" y="148.13" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#C92526" text-anchor="middle">Crossing floor C = 1.37 / coord</text><text x="140" y="170.13" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15181C" text-anchor="middle">ODE paths bend to avoid crossing</text><text x="140" y="191.96" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#C92526" text-anchor="middle">Needs 32 Euler steps (1-step collapses)</text><rect x="280" y="68" width="240" height="138" rx="10" fill="#FFFFFF" stroke="#2CA02C" stroke-width="2"/><rect x="286" y="74" width="228" height="30" rx="6" fill="#E6F4E6" stroke="none" stroke-width="0"/><text x="400" y="93.75" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.4" font-weight="700" fill="#227D22" text-anchor="middle">Round 2: Reflowed Pairs (Z₀, Z₁)</text><text x="400" y="125.83" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="600" fill="#15181C" text-anchor="middle">Deterministic ODE endpoints never cross:</text><text x="400" y="147.89" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="700" fill="#227D22" text-anchor="middle">Crossing floor C drops 1.37 → below 0.001</text><text x="400" y="169.79" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15181C" text-anchor="middle">Trajectories become about 50× straighter;</text><text x="400" y="192.29" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#227D22" text-anchor="middle">1 Euler step matches 32 steps!</text><rect x="20" y="220" width="500" height="48" rx="8" fill="#F2EDF7" stroke="#9467BD" stroke-width="2"/><text x="270" y="247.83" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="700" fill="#825BA6" text-anchor="middle">Double-Jensen Theorem:  E[c(Z₁ − Z₀)] ≤ E[c(X₁ − X₀)]  for all convex costs c (drops ‖·‖² by ≥ C)</text></svg>
