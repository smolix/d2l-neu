<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 286" width="560" height="286"><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');]]></style><text x="280" y="22.95" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#15181C" text-anchor="middle">Combining Orthogonal Memory-Reduction Techniques Deliberately</text><rect x="20" y="36" width="250" height="96" rx="8" fill="#E4EFF6" stroke="#1F77B4" stroke-width="2"/><text x="145" y="62.62" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1D70A9" text-anchor="middle">1. State Sharding (FSDP2 / ZeRO)</text><text x="145" y="82.76" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.4" font-weight="600" fill="#15181C" text-anchor="middle">Divides params, grads &amp; Adam moments by W</text><text x="145" y="106.76" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.4" font-weight="600" fill="#15181C" text-anchor="middle">Cost: ~1.5× collective comm over NVLink/IB</text><rect x="290" y="36" width="250" height="96" rx="8" fill="#E6F4E6" stroke="#2CA02C" stroke-width="2"/><text x="415" y="61.76" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.4" font-weight="700" fill="#227D22" text-anchor="middle">2. Activation Checkpointing + Accumulation</text><text x="415" y="82.63" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#15181C" text-anchor="middle">Checkpointing: keep block</text><text x="415" y="104.13" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#15181C" text-anchor="middle">inputs only, +33% FLOPs</text><text x="415" y="125.63" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#15181C" text-anchor="middle">Accumulation: shrinks microbatch B<tspan baseline-shift="sub" font-size="70%">device</tspan></text><rect x="20" y="144" width="250" height="96" rx="8" fill="#FFF0E2" stroke="#FF7F0E" stroke-width="2"/><text x="145" y="170.39" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.3" font-weight="700" fill="#AD560A" text-anchor="middle">3. CPU / NVMe Offload (ZeRO-Offload)</text><text x="145" y="190.93" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.9" font-weight="600" fill="#15181C" text-anchor="middle">Moves FP32 master weights &amp; Adam to host</text><text x="145" y="214.93" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.9" font-weight="600" fill="#15181C" text-anchor="middle">Cost: PCIe transfer + CPU DDR time/step</text><rect x="290" y="144" width="250" height="96" rx="8" fill="#F2EDF7" stroke="#9467BD" stroke-width="2"/><text x="415" y="170.62" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#825BA6" text-anchor="middle">4. Adapter Tuning (LoRA / QLoRA)</text><text x="415" y="190.83" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="600" fill="#15181C" text-anchor="middle">Freezes base weights (4-bit NF4 in QLoRA)</text><text x="415" y="214.83" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.6" font-weight="600" fill="#15181C" text-anchor="middle">Drops &gt;98% of gradients &amp; Adam moments!</text><rect x="20" y="250" width="520" height="28" rx="6" fill="#F0F2F5" stroke="#565D66" stroke-width="1.8"/><text x="280" y="267.66" font-family="'Source Sans 3', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.1" font-weight="700" fill="#15181C" text-anchor="middle">Apply only the techniques needed to fit target VRAM—extra knobs add comm or compute overhead.</text></svg>
