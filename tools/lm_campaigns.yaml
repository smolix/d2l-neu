# Compute campaigns of the Language Models part: runs that go beyond the
# book's RTX 4090 server, packaged ready to launch (plan, "Compute
# campaigns"). A campaign is run only after the author's go; its outputs are
# then uploaded (make upload-data), registered in DATA_HUB and the section is
# re-run. Fields left null are filled from the smoke run of the T1
# regeneration (data-mixtures.md, mix-t1: OUT/smoke-t2.json).
campaigns:
  - id: 20.4-mixtures-t2
    section: sec_lm_data_mixtures (chapter_lm-data/data-mixtures.md)
    tier: T2
    status: packaged, not run (author ruling 2026-11-14)
    config: d2l.MIX_CONFIGS['t2'] (20.3M-parameter proxies, 2^27 tokens per run)
    command: >-
      python tools/build_mix_pools.py --config t2 --check --tar data/lm/mix/upload &&
      python tools/run_mix_campaign.py --config t2 --gpus 0,1,2,3
      --out data/lm/rerun/mix-t2
    resume: python tools/run_mix_campaign.py --config t2 --gpus 0,1,2,3 --out data/lm/rerun/mix-t2 --resume
    depends:
      - lm-r2-tokenizer-v1
      - HuggingFaceFW/fineweb-edu sample/10BT @ 87f09149 (about 8 files for 150M bucket-1-7 tokens)
      - HuggingFaceTB/finemath finemath-4plus @ e92b25a6
      - codeparrot/codeparrot-clean @ 35a59fb0 (permissive licences only; built locally, never hosted)
    runs: 45 proxy runs (19 training mixtures, 3 of them the fixed corner mixtures MIX_EDGES) plus 4 learning-rate runs at 2^25 tokens (d2l.mix_run_specs)
    flop: 9.6e17  # arithmetic (6ND + 12 L d T D per run, DoReMi's run x 10/6); the smoke prints its own count
    compile: true  # MIX_CONFIGS['t2']['compile']: torch.compile, +11% tokens/s on the 4090; micro-batch 16 (32: +2% at twice the memory; 64 does not fit 24 GB)
    predicted_a100_hours: 2.9  # smoke of mix-t1 (lm-mix-runs-t1-v1, 2026-11-21): FLOP / (312e12 x 0.30, the compiled MFU on the 4090) + compile time once per run; 5.4 GPU-hours on one RTX 4090, about 1.4 h on four
    memory_gib_per_run: 8.4  # smoke peak on the 4090; two runs per 40 GB card
    stop_hours: null  # if null, the launcher stops at 1.5 x the smoke's predicted GPU-hours on the node's cards / the number of workers (--max-hours overrides)
    gpus: the runs are independent after the learning-rate choice; one worker per GPU
    outputs:
      - data/lm/rerun/mix-t2/lm-mix-runs-t2-v1.json -> lm-mix-runs-t2-v1
      - data/lm/mix/upload/lm-mix-web-150m-v1.tar -> lm-mix-web-150m-v1
      - data/lm/mix/upload/lm-mix-math-150m-v1.tar -> lm-mix-math-150m-v1
      - data/lm/mix/upload/lm-mix-val-2m-v1.tar -> lm-mix-val-2m-v1
      - data/lm/mix/upload/lm-mix-code150-meta-v1.tar -> lm-mix-code150-meta-v1
    after: >-
      upload and register the five keys in data-mixtures.md's data-hub cell;
      re-run the section (RUNS_KEY switches to lm-mix-runs-t2-v1 by itself);
      rewrite every sentence marked "campaign: lm-mix-runs-t2-v1"
  - id: 20.4-mixtures-t2s
    section: sec_lm_data_mixtures (chapter_lm-data/data-mixtures.md)
    tier: T2, small-scale test
    status: run 2026-11-21 on the four RTX 4090s (author ruling 2026-11-20) as a test of the T2 code path; never the T2 result
    config: run_mix_campaign.py's 't2s' (d2l.MIX_CONFIGS['t2'] at half its tokens, 2^26 per run, 2^24 per learning-rate run, on the T2 pools)
    command: python tools/run_mix_campaign.py --config t2s --gpus 0,1,2,3 --out data/lm/rerun/mix-t2s --max-hours 0.25, then the same with --resume --max-hours 3 (tests the time stop and the resume)
    measured: 49 runs, 2.7 GPU-hours of runs (3.1 GPU-hours of reserved cards), 46 min wall on four RTX 4090s; the time stop left 4 runs at their step-768 checkpoints, and the resume finished them
    outputs:
      - data/lm/rerun/mix-t2s/lm-mix-runs-t2s-v1.json -> lm-mix-runs-t2s-v1 (registered)
  - id: 21.3-lowp-blackwell
    section: sec_lm_low_precision (chapter_lm-pretraining/low-precision.md)
    tier: T1 on Blackwell (one B200/B300 or RTX 50-series card; compute capability 10.0, 10.3, 12.0 or 12.1)
    status: packaged, not run (no FP4 tensor cores on the RTX 4090s)
    ruling: D3 revised 2026-11-25 (NVFP4/MXFP4 simulated on Ada, native on Blackwell)
    config: d2l.PRETRAIN_JOBS['lowp-blackwell'] (fp8 preset, 400 steps)
    schedule: decay 60, validation every 100; arms bf16 seeds 0-3, nvfp4-mlp simulated and native, seed 0
    check: >-
      before the runs, python -c "from d2l import torch as d2l; print(d2l.fp4_backend('cuda'))"
      must print "native (NVFP4: E4M3 scales, blocks of 16)"; a "simulated (...)" line names why not
      (capability, torch API, or the probe GEMM against the simulator), and the native arm then refuses to start
    command: python tools/lm_regen.py lowp-blackwell
    resume: the same command (each run's file in data/lm/rerun/ch21/lowp-blackwell/ is reused)
    depends:
      - lm-r2-tokenizer-v1
      - lm-fwedu-shards-100m-v1
      - lm-fwedu-val-v1
    runs: 6 runs of 400 steps (6.6M tokens each); FP4 GEMMs eager, no speed claimed
    predicted_gpu_hours: 0.5  # RTX 4090 arms (lm-lowp-runs-v1): bf16 about 3.5 min per 1,221 steps, simulated nvfp4-mlp about 17 min; at 400 steps about 25 min on a 4090, less on a B200
    memory_gib_per_run: 12  # lm-lowp-runs-v1 peak on the RTX 4090: bf16 10.1 GiB, nvfp4-mlp 11.3 GiB
    gpus: one card; the runs are sequential in one process
    outputs:
      - data/lm/rerun/lm-lowp-blackwell-v1.json.gz -> lm-lowp-blackwell-v1
    after: >-
      upload and register lm-lowp-blackwell-v1 in low-precision-lib.md's data-hub cell; add the page cell that
      prints the native - simulated final validation loss of the nvfp4 arms against the bf16 seeds' SD at
      400 steps (claim 13: within one SD) and rewrite the "not run on Blackwell" sentences of 21.3
